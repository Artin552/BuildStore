# ============================================================
# nginx reverse proxy для BuildStoreNET
# 1) скопируйте на сервер: /etc/nginx/sites-available/buildstorenet
# 2) замените mydomain.ru на ваш домен (или _ для работы по IP)
# 3) sudo ln -s /etc/nginx/sites-available/buildstorenet /etc/nginx/sites-enabled/
# 4) sudo nginx -t && sudo systemctl reload nginx
# 5) HTTPS: sudo certbot --nginx -d mydomain.ru
# ============================================================
server {
    listen 80;
    listen [::]:80;
    # замените на ваш домен:
    server_name mydomain.ru www.mydomain.ru;

    client_max_body_size 8m;   # загрузка картинок до 5 МБ + запас

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # чтобы express-rate-limit видел реальный IP клиента за nginx:
        # (в app.js: app.set('trust proxy', 1))
    }
}
