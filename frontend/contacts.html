<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Контакты — BuildStore</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
  <script src="/frontend/js/theme.js" defer></script>
  <script src="/frontend/js/api.js" defer></script>
  <script src="/frontend/js/layout.js" defer></script>
  <script src="/frontend/js/auth.js" defer></script>
  <script src="/frontend/js/cart.js" defer></script>

  <style>
    /* Специфичные для страницы контакты стили поверх дизайн-системы */
    .contacts-main { padding-top: 32px; padding-bottom: 48px; }
    .contacts-header { text-align: center; margin-bottom: 32px; }
    .contacts-header p { color: var(--muted, #6b7280); max-width: 560px; margin: 8px auto 0; }
    .card {
      background: var(--card, #fff);
      border-radius: var(--radius, 12px);
      padding: 30px;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 480px;
      margin: 0 auto;
    }
    .avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(26, 54, 93, .08);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; color: var(--primary);
    }
    .name { font-size: 1.6rem; margin: 10px 0; font-weight: 800; }
    .role { color: var(--muted, #6b7280); margin-bottom: 20px; }
    .contact-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .contact-link {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 10px 20px;
      border-radius: 12px; text-decoration: none;
      background: var(--primary); color: #fff;
    }
    .contact-link:hover { filter: brightness(1.08); color: #fff; }
    .contact-link svg { width: 20px; height: 20px; }
    @media (max-width: 600px) {
      .contact-links { flex-direction: column; gap: 10px; }
      .contact-link { justify-content: center; }
    }
  </style>
