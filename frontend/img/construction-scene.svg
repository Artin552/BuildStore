<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="constructionTitle constructionDesc">
  <title id="constructionTitle">Строительная площадка — иллюстрация</title>
  <desc id="constructionDesc">Стилизованное изображение стройплощадки с краном и зданием</desc>
  
  <!-- Небо -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" class="sky-light"/>
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" class="sky-dark"/>
    </linearGradient>
    
    <!-- Градиент для тёмной темы -->
    <linearGradient id="skyGradientDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1524;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="800" height="600" fill="url(#skyGradient)" class="sky"/>
  
  <!-- Земля -->
  <rect x="0" y="500" width="800" height="100" fill="#8B7355" class="ground"/>
  
  <!-- Здание (упрощённое) -->
  <g filter="url(#shadow)">
    <rect x="100" y="250" width="200" height="250" fill="#4A5568" class="building"/>
    <rect x="100" y="250" width="200" height="20" fill="#2D3748" class="building-roof"/>
    
    <!-- Окна -->
    <rect x="120" y="280" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="170" y="280" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="220" y="280" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    
    <rect x="120" y="340" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="170" y="340" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="220" y="340" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    
    <rect x="120" y="400" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="170" y="400" width="30" height="40" fill="#F6E05E" class="window window-light"/>
    <rect x="220" y="400" width="30" height="40" fill="#F6E05E" class="window window-light"/>
  </g>
  
  <!-- Кран -->
  <g filter="url(#shadow)" class="crane">
    <!-- Основание -->
    <rect x="450" y="450" width="40" height="50" fill="#2D3748" class="crane-base"/>
    
    <!-- Вертикальная мачта -->
    <rect x="460" y="150" width="20" height="300" fill="#FFB400" class="crane-mast"/>
    
    <!-- Горизонтальная стрела -->
    <rect x="350" y="140" width="250" height="20" fill="#FFB400" class="crane-jib"/>
    
    <!-- Кабина -->
    <rect x="440" y="160" width="40" height="30" fill="#FFB400" rx="5" class="crane-cab"/>
    
    <!-- Трос с грузом -->
    <line x1="400" y1="160" x2="400" y2="350" stroke="#2D3748" stroke-width="3" class="crane-cable"/>
    <rect x="385" y="350" width="30" height="20" fill="#4A5568" class="crane-load"/>
    
    <!-- Сигнальный огонь на верхушке -->
    <circle cx="470" cy="145" r="6" fill="#EF4444" class="crane-light crane-light-blink"/>
  </g>
  
  <!-- Стройматериалы на земле -->
  <g class="materials">
    <!-- Кирпичи -->
    <rect x="550" y="480" width="60" height="20" fill="#C53030" class="brick-pile"/>
    <rect x="555" y="475" width="50" height="8" fill="#C53030" class="brick-pile"/>
    
    <!-- Мешки цемента -->
    <rect x="620" y="470" width="25" height="30" fill="#A0AEC0" rx="3" class="cement-bag"/>
    <rect x="640" y="475" width="25" height="30" fill="#A0AEC0" rx="3" class="cement-bag"/>
    
    <!-- Бетонные блоки -->
    <rect x="700" y="480" width="40" height="25" fill="#718096" class="concrete-block"/>
    <rect x="720" y="465" width="40" height="25" fill="#718096" class="concrete-block"/>
  </g>
  
  <!-- Дорожный конус -->
  <path d="M 50 500 L 70 500 L 60 460 Z" fill="#F97316" class="cone"/>
  <rect x="52" y="500" width="16" height="8" fill="#F97316" class="cone-base"/>
  
  <!-- Стилизация для тёмной темы -->
  <style>
    /* Светлая тема (по умолчанию) */
    .sky-light { stop-color: #87CEEB; }
    .sky-dark { stop-color: #E0F4FF; }
    .building { fill: #4A5568; }
    .ground { fill: #8B7355; }
    .window-light { fill: #F6E05E; opacity: 0.8; }
    
    /* Тёмная тема */
    [data-theme="dark"] .sky {
      fill: url(#skyGradientDark) !important;
    }
    [data-theme="dark"] .building {
      fill: #2D3748;
    }
    [data-theme="dark"] .ground {
      fill: #4A3728;
    }
    [data-theme="dark"] .window-light {
      fill: #FCD34D;
      opacity: 1;
    }
    [data-theme="dark"] .crane-light-blink {
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</svg>
