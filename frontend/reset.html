<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Сброс пароля — BuildStore</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
</head>
<body>
  <main class="auth-container">
    <h2>Сброс пароля</h2>
    <form id="resetForm" class="auth-form">
      <div class="form__group">
        <input class="form__field" id="token" name="token" placeholder="Код" required />
        <label class="form__label" for="token">Код</label>
      </div>
      <div class="form__group">
        <input class="form__field" id="newpass" name="password" placeholder="Новый пароль" type="password" minlength="6" required />
        <label class="form__label" for="newpass">Новый пароль</label>
        <button type="button" class="icon-btn" id="toggleNewPassword" aria-label="Показать пароль" style="position:absolute; right:14px; top:28px; background:transparent; border:none; font-size:14px">👁️</button>
      </div>
      <div class="form__group">
        <input class="form__field" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" type="password" minlength="6" required />
        <label class="form__label" for="confirmPassword">Повторите пароль</label>
        <button type="button" class="icon-btn" id="toggleConfirmPassword" aria-label="Показать пароль" style="position:absolute; right:14px; top:28px; background:transparent; border:none; font-size:14px">👁️</button>
      </div>
      <div class="auth-btns">
        <button class="btn" type="submit">Сменить пароль</button>
      </div>
    </form>
  </main>

<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('token').value.trim();
  const password = document.getElementById('newpass').value;
  try {
    // validate password match on client
    const confirm = document.getElementById('confirmPassword')?.value || '';
    if(password !== confirm){ alert('Пароли не совпадают'); return; }
    const res = await fetch('/api/auth/reset', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (res.ok) { alert(data.message || 'Пароль изменён'); window.location.href = '/frontend/auth.html'; }
    else alert(data.error || 'Ошибка');
  } catch (err) { console.error(err); alert('Ошибка соединения'); }
});
// toggles for reset password fields
const toggleNewPassword = document.getElementById('toggleNewPassword');
if(toggleNewPassword){
  toggleNewPassword.addEventListener('click', ()=>{
    const p = document.getElementById('newpass'); if(!p) return;
    if(p.type === 'password'){ p.type = 'text'; toggleNewPassword.textContent = '🙈'; toggleNewPassword.setAttribute('aria-label','Скрыть пароль'); }
    else { p.type = 'password'; toggleNewPassword.textContent = '👁️'; toggleNewPassword.setAttribute('aria-label','Показать пароль'); }
  });
}
const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
if(toggleConfirmPassword){
  toggleConfirmPassword.addEventListener('click', ()=>{
    const p = document.getElementById('confirmPassword'); if(!p) return;
    if(p.type === 'password'){ p.type = 'text'; toggleConfirmPassword.textContent = '🙈'; toggleConfirmPassword.setAttribute('aria-label','Скрыть пароль'); }
    else { p.type = 'password'; toggleConfirmPassword.textContent = '👁️'; toggleConfirmPassword.setAttribute('aria-label','Показать пароль'); }
  });
}
</script>
</body>
</html>
