<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход / Регистрация — BuildStore</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
  <script src="/frontend/js/auth.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <h2>Вход</h2>
    <form id="loginForm" class="auth-form">
      <div class="form__group">
        <input class="form__field" id="email" name="email" placeholder="Email " type="email" required />
      </div>

      <div class="form__group">
        <input class="form__field" id="password" name="password" placeholder="Пароль" type="password" minlength="6" required />
        <button type="button" class="icon-btn" id="togglePassword" aria-label="Показать пароль" style="position:absolute; right:14px; top:28px; background:transparent; border:none; font-size:14px">👁️</button>
      </div>

      <div class="forgot-link">
        <a href="/frontend/reg.html">Регистрация</a> |
        <a href="/frontend/forgot.html">Забыли пароль?</a>
      </div>

      <div class="auth-btns">
        <button class="btn" type="submit">Войти</button>
        <a href="/index.html" class="btn secondary">Отмена</a>
      </div>
    </form>
  </main>
</body>
</html>
