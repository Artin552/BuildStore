<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — СтройМаркет</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/cart-page.js" defer></script>
  <style>
    .cart-item {
      display: flex;
      gap: 16px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .cart-item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .cart-item-info {
      flex: 1;
      min-width: 200px;
    }
    .cart-item-title {
      font-weight: 600;
      margin-bottom: 8px;
    }
    .cart-item-price {
      color: var(--primary);
      font-weight: 700;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .cart-item-quantity input {
      width: 50px;
      padding: 4px;
      border: 1px solid #ddd;
      border-radius: 4px;
      text-align: center;
    }
    .cart-item-remove {
      padding: 8px 12px;
      background: #fee;
      color: #c33;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .cart-item-remove:hover {
      background: #fcc;
    }
    .cart-summary {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin-left: auto;
      margin-top: 20px;
    }
    .cart-summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .cart-summary-total {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      border-top: 2px solid #ddd;
      padding-top: 12px;
      margin-top: 12px;
    }
    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .cart-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- ШАПКА САЙТА -->
  <header class="header main-header" id="mainHeader">
    <div class="top_header header-inner container">
      <!-- Логотип и брендинг -->
      <div class="logo-wrap">
        <a class="logo" href="/index.html">
          <span class="brand">BUILDSTORE</span>
        </a>
        <div class="hammer" id="hammer" title="Строительный молоток" aria-hidden="true">
          🔨
        </div>
      </div>

      <!-- Поиск товаров -->
      <div style="flex: 1; margin: 0 16px;">
        <div class="search-inline">
          <input id="searchInput" placeholder="Поиск по объявлениям">
          <button class="btn" id="searchBtn">Поиск</button>
        </div>
      </div>

      <!-- Кнопка "Добавить" -->
      <a href="/frontend/add.html" class="btn">Создать обьявление</a>
    </div>
  </header>

  <!-- ОСНОВНОЕ СОДЕРЖИМОЕ -->
  <main class="container" style="padding: 20px 0 40px 0;">
    <h1 style="margin-bottom: 24px;">🛒 Корзина</h1>

    <div id="cartContainer">
      <!-- Содержимое будет заполнено JavaScript -->
    </div>
  </main>

  <!-- ФУТЕР -->
  <footer class="footer">
    © 2025 СтройМаркет
  </footer>
</body>
</html>
